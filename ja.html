<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文假名練習</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 50px; background-color: #f4f4f4; }
        h1 { color: #333; }
        #prompt { font-size: 48px; margin: 20px; background-color: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .input-group { margin: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { padding: 10px; font-size: 24px; width: 200px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; font-size: 18px; margin: 10px; cursor: pointer; border: none; border-radius: 4px; }
        #checkBtn { background-color: #4CAF50; color: white; }
        #nextBtn { background-color: #2196F3; color: white; }
        #startBtn { background-color: #FF9800; color: white; }
        #resetBtn { background-color: #f44336; color: white; }
        #feedback { font-size: 24px; margin: 20px; }
        #timer { font-size: 20px; margin: 10px; font-weight: bold; }
        #stats { margin-top: 30px; padding: 20px; background-color: #fff; border: 1px solid #ddd; border-radius: 8px; display: none; }
        .correct { color: green; }
        .incorrect { color: red; }
        table { margin: 20px auto; border-collapse: collapse; width: 80%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>日文假名練習：隨機轉換</h1>
    <div id="timer">總時間：0.00 秒</div>
    <div id="remaining">剩餘題目：0 / 0</div>
    <div id="prompt">點擊「開始練習」按鈕開始</div>
    <div class="input-group">
        <label id="input1Label">輸入...</label>
        <input type="text" id="input1" disabled>
    </div>
    <div class="input-group">
        <label id="input2Label">輸入...</label>
        <input type="text" id="input2" disabled>
    </div>
    <button id="startBtn">開始練習</button>
    <button id="checkBtn" disabled>檢查答案</button>
    <button id="nextBtn" disabled>下一題</button>
    <button id="resetBtn" disabled>重新開始</button>
    <div id="feedback"></div>
    <div id="stats">
        <h2>練習統計</h2>
        <p id="totalTime"></p>
        <p id="avgTime"></p>
        <p id="longestTime"></p>
        <p id="shortestTime"></p>
        <table>
            <thead>
                <tr>
                    <th>假名</th>
                    <th>回答時間 (秒)</th>
                    <th>是否正確</th>
                </tr>
            </thead>
            <tbody id="statsTable"></tbody>
        </table>
    </div>

    <script>
        // 基本50音數據（你可以擴充）
        const kanaData = [
            { hiragana: 'あ', katakana: 'ア', romaji: 'a' },
            { hiragana: 'い', katakana: 'イ', romaji: 'i' },
            { hiragana: 'う', katakana: 'ウ', romaji: 'u' },
            { hiragana: 'え', katakana: 'エ', romaji: 'e' },
            { hiragana: 'お', katakana: 'オ', romaji: 'o' },
            { hiragana: 'か', katakana: 'カ', romaji: 'ka' },
            { hiragana: 'き', katakana: 'キ', romaji: 'ki' },
            { hiragana: 'く', katakana: 'ク', romaji: 'ku' },
            { hiragana: 'け', katakana: 'ケ', romaji: 'ke' },
            { hiragana: 'こ', katakana: 'コ', romaji: 'ko' },
            { hiragana: 'さ', katakana: 'サ', romaji: 'sa' },
            { hiragana: 'し', katakana: 'シ', romaji: 'si/shi' },
            { hiragana: 'す', katakana: 'ス', romaji: 'su' },
            { hiragana: 'せ', katakana: 'セ', romaji: 'se' },
            { hiragana: 'そ', katakana: 'ソ', romaji: 'so' },
            { hiragana: 'た', katakana: 'タ', romaji: 'ta' },
            { hiragana: 'ち', katakana: 'チ', romaji: 'ti/chi' },
            { hiragana: 'つ', katakana: 'ツ', romaji: 'tu/tsu' },
            { hiragana: 'て', katakana: 'テ', romaji: 'te' },
            { hiragana: 'と', katakana: 'ト', romaji: 'to' },
            { hiragana: 'な', katakana: 'ナ', romaji: 'na' },
            { hiragana: 'に', katakana: 'ニ', romaji: 'ni' },
            { hiragana: 'ぬ', katakana: 'ヌ', romaji: 'nu' },
            { hiragana: 'ね', katakana: 'ネ', romaji: 'ne' },
            { hiragana: 'の', katakana: 'ノ', romaji: 'no' },
            { hiragana: 'は', katakana: 'ハ', romaji: 'ha' },
            { hiragana: 'ひ', katakana: 'ヒ', romaji: 'hi' },
            { hiragana: 'ふ', katakana: 'フ', romaji: 'fu' },
            { hiragana: 'へ', katakana: 'ヘ', romaji: 'he' },
            { hiragana: 'ほ', katakana: 'ホ', romaji: 'ho' },
            { hiragana: 'ま', katakana: 'マ', romaji: 'ma' },
            { hiragana: 'み', katakana: 'ミ', romaji: 'mi' },
            { hiragana: 'む', katakana: 'ム', romaji: 'mu' },
            { hiragana: 'め', katakana: 'メ', romaji: 'me' },
            { hiragana: 'も', katakana: 'モ', romaji: 'mo' },
            { hiragana: 'や', katakana: 'ヤ', romaji: 'ya' },
            { hiragana: 'ゆ', katakana: 'ユ', romaji: 'yu' },
            { hiragana: 'よ', katakana: 'ヨ', romaji: 'yo' },
            { hiragana: 'ら', katakana: 'ラ', romaji: 'ra' },
            { hiragana: 'り', katakana: 'リ', romaji: 'ri' },
            { hiragana: 'る', katakana: 'ル', romaji: 'ru' },
            { hiragana: 'れ', katakana: 'レ', romaji: 're' },
            { hiragana: 'ろ', katakana: 'ロ', romaji: 'ro' },
            { hiragana: 'わ', katakana: 'ワ', romaji: 'wa' },
            { hiragana: 'を', katakana: 'ヲ', romaji: 'wo' },
            { hiragana: 'ん', katakana: 'ン', romaji: 'n' }
            // 加濁音或其他時，在這裡擴充 e.g., { hiragana: 'が', katakana: 'ガ', romaji: 'ga' }
        ];

        let currentKana = null;
        let shownType = null;
        let input1Type = null;
        let input2Type = null;
        let startTime = 0;
        let totalTime = 0;
        let questionStartTime = 0;
        let isPracticing = false;
        let stats = [];
        let timerInterval = null;

        function getRandomKana() {
            return kanaData[Math.floor(Math.random() * kanaData.length)];
        }

        function getRandomType() {
            const types = ['hiragana', 'katakana', 'romaji'];
            return types[Math.floor(Math.random() * types.length)];
        }

        function setupQuestion() {
            currentKana = getRandomKana();
            shownType = getRandomType();
            const remainingTypes = ['hiragana', 'katakana', 'romaji'].filter(t => t !== shownType);
            input1Type = remainingTypes[0];
            input2Type = remainingTypes[1];

            document.getElementById('prompt').textContent = currentKana[shownType];
            document.getElementById('input1Label').textContent = `輸入 ${input1Type === 'hiragana' ? '平假名' : input1Type === 'katakana' ? '片假名' : '羅馬字'}`;
            document.getElementById('input2Label').textContent = `輸入 ${input2Type === 'hiragana' ? '平假名' : input2Type === 'katakana' ? '片假名' : '羅馬字'}`;
            document.getElementById('input1').value = '';
            document.getElementById('input2').value = '';
            document.getElementById('feedback').textContent = '';
            document.getElementById('input1').classList.remove('correct', 'incorrect');
            document.getElementById('input2').classList.remove('correct', 'incorrect');
            
            // 記錄這題的開始時間
            questionStartTime = Date.now();
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                totalTime = (Date.now() - startTime) / 1000;
                document.getElementById('timer').textContent = `總時間：${totalTime.toFixed(2)} 秒`;
            }, 100);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function calculateStats() {
            if (stats.length === 0) return;
            
            const totalQuestionTime = stats.reduce((sum, stat) => sum + stat.time, 0);
            const avgTime = totalQuestionTime / stats.length;
            const longest = stats.reduce((max, stat) => stat.time > max.time ? stat : max);
            const shortest = stats.reduce((min, stat) => stat.time < min.time ? stat : min);
            
            document.getElementById('totalTime').textContent = `總練習時間：${totalTime.toFixed(2)} 秒`;
            document.getElementById('avgTime').textContent = `平均回答時間：${avgTime.toFixed(2)} 秒`;
            document.getElementById('longestTime').textContent = `最長回答時間：${longest.kana.hiragana} (${longest.time.toFixed(2)} 秒)`;
            document.getElementById('shortestTime').textContent = `最短回答時間：${shortest.kana.hiragana} (${shortest.time.toFixed(2)} 秒)`;
            
            const statsTable = document.getElementById('statsTable');
            statsTable.innerHTML = '';
            
            stats.forEach(stat => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${stat.kana.hiragana} / ${stat.kana.katakana} / ${stat.kana.romaji}</td>
                    <td>${stat.time.toFixed(2)}</td>
                    <td>${stat.correct ? '✓' : '✗'}</td>
                `;
                statsTable.appendChild(row);
            });
            
            document.getElementById('stats').style.display = 'block';
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            isPracticing = true;
            stats = [];
            totalTime = 0;
            document.getElementById('stats').style.display = 'none';
            document.getElementById('startBtn').disabled = true;
            document.getElementById('checkBtn').disabled = false;
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('resetBtn').disabled = false;
            document.getElementById('input1').disabled = false;
            document.getElementById('input2').disabled = false;
            startTimer();
            setupQuestion();
        });

        document.getElementById('checkBtn').addEventListener('click', () => {
            const input1 = document.getElementById('input1').value.trim().toLowerCase();
            const input2 = document.getElementById('input2').value.trim().toLowerCase();
            const correct1 = currentKana[input1Type].toLowerCase();
            const correct2 = currentKana[input2Type].toLowerCase();
            const isCorrect = input1 === correct1 && input2 === correct2;
            
            // 計算這題的回答時間
            const questionTime = (Date.now() - questionStartTime) / 1000;
            
            // 記錄統計數據
            stats.push({
                kana: currentKana,
                time: questionTime,
                correct: isCorrect
            });

            document.getElementById('input1').classList.add(input1 === correct1 ? 'correct' : 'incorrect');
            document.getElementById('input2').classList.add(input2 === correct2 ? 'correct' : 'incorrect');

            if (isCorrect) {
                document.getElementById('feedback').textContent = '正確！';
                document.getElementById('feedback').classList.add('correct');
            } else {
                document.getElementById('feedback').textContent = `錯誤。正確答案：${input1Type}: ${correct1}, ${input2Type}: ${correct2}`;
                document.getElementById('feedback').classList.add('incorrect');
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            // 檢查是否所有假名都已練習過
            if (stats.length >= kanaData.length) {
                isPracticing = false;
                stopTimer();
                calculateStats();
                document.getElementById('checkBtn').disabled = true;
                document.getElementById('nextBtn').disabled = true;
                document.getElementById('input1').disabled = true;
                document.getElementById('input2').disabled = true;
                document.getElementById('prompt').textContent = '練習完成！';
            } else {
                setupQuestion();
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            isPracticing = false;
            stopTimer();
            totalTime = 0;
            document.getElementById('timer').textContent = '總時間：0.00 秒';
            document.getElementById('prompt').textContent = '點擊「開始練習」按鈕開始';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('checkBtn').disabled = true;
            document.getElementById('nextBtn').disabled = true;
            document.getElementById('resetBtn').disabled = true;
            document.getElementById('input1').disabled = true;
            document.getElementById('input2').disabled = true;
            document.getElementById('feedback').textContent = '';
            document.getElementById('stats').style.display = 'none';
        });

        // 初始載入
        document.getElementById('checkBtn').disabled = true;
        document.getElementById('nextBtn').disabled = true;
        document.getElementById('resetBtn').disabled = true;
        document.getElementById('input1').disabled = true;
        document.getElementById('input2').disabled = true;
    </script>
</body>
</html>
